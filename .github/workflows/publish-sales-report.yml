name: Publish Sales-report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powerbi-publish-${{ vars.PBI_WORKSPACE_ID }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: powerbi
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      PBI_WORKSPACE_ID: ${{ vars.PBI_WORKSPACE_ID }}
      AZURE_CORE_LOGIN_EXPERIENCE_V2: "off"
    steps:
      - name: Configure Azure CLI directory
        shell: bash
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/powerbi-azure-cli" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-deployment.txt
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_TENANT_ID:?Set the AZURE_TENANT_ID repository variable}"
          : "${PBI_WORKSPACE_ID:?Set the PBI_WORKSPACE_ID repository variable}"
      - name: Install deployment dependencies
        run: python -m pip install -r scripts/requirements-deployment.txt
      - name: Validate and test
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/deploy_powerbi.py sales-report --validate-only
      - name: Sign in as a Power BI user (open logs for device code)
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          echo "Open the Microsoft URL printed below and enter the device code."
          echo "Sign in with the Power BI account that has access to the target workspace."
          az login --tenant "$AZURE_TENANT_ID" --use-device-code --allow-no-subscriptions --output none
      - name: Publish Sales-report only
        run: python scripts/deploy_powerbi.py sales-report
      - name: Clear Azure CLI credentials
        if: always()
        run: az account clear
